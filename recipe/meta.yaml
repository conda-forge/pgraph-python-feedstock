{% set name = "pgraph-python" %}
{% set version = "0.6.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2462d0fd6a7278779f37fc8a582d1817ab6930c4a2b83cad0ee93256637f7f76

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - setuptools
  run:
    - matplotlib-base
    - spatialmath-python
    - numpy
    - python >={{ python_min }}

test:
  imports:
    - pgraph
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/petercorke/pgraph-python
  summary: Simple graph functionality for Python.
  dev_url: https://github.com/petercorke/pgraph-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
