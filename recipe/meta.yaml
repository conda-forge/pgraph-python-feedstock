{% set name = "pgraph-python" %}
{% set version = "1.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f5bc1c3ecc3c11cc3619e7a8bd82ad1bf17bf3888ffb7c06b1709cd010f7d407

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - setuptools
  run:
    - matplotlib-base
    - spatialmath-python
    - numpy
    - python >={{ python_min }}

test:
  imports:
    - pgraph
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/petercorke/pgraph-python
  summary: Simple graph functionality for Python.
  dev_url: https://github.com/petercorke/pgraph-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
